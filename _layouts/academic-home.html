<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="{{ '/assets/css/academic-home.css' | relative_url }}">
    <script>
      try { if (localStorage.getItem('academic-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}
    </script>
  </head>
  <body class="academic-page">
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="site-name" href="{{ '/' | relative_url }}">Zeliang Chen<span class="name-dot">.</span></a>
        <nav aria-label="Main navigation">
          <a href="#about">About</a><a href="#publications">Publications</a><a href="#education">Education</a>
          <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.8 13.2A9 9 0 0 1 10.8 3.2 9 9 0 1 0 20.8 13.2Z"/></svg></button>
        </nav>
      </div>
    </header>
    {{ content }}
    <script src="{{ '/assets/js/academic-home.js' | relative_url }}" defer></script>
  </body>
</html>
